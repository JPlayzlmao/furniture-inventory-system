{% extends "base.html" %}
{% block content %}

<h1>Edit Amount</h1>
<form action="{{ url_for('update_order_item', id=item[0]) }}" method="POST">
    <label>Product: {{ item[1] }}</label><br><br>
    <label>Selling Price: Rp {{ "{:,.0f}".format(item[3]) }}</label><br><br>
    <label>Quantity: </label>
    <input type="number" name="quantity" value="{{ item[2] }}" min="1" required><br><br>
    <button type="submit">Save</button>
</form>

{% endblock %}
