{% extends "base.html" %}
{% block content %}
<h1>Products</h1>
<form action="/add_product" method="POST">
    <label>Name</label>
    <input type="text" name="name" required><br><br>
    <label>Selling Price</label>
    <input type="number" name="selling_price" required><br><br>
    <label>Description</label>
    <input type="text" name="description"><br><br>
    <button type="submit">Add Product</button>
</form>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Selling Price</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>
    <h2>Available Products</h2>
    {% for product in products %}
    <tr>
        <td>{{ product[0] }}</td>
        <td>{{ product[1] }}</td>
        <td>Rp {{ "{:,.0f}".format(product[2]) }}</td>
        <td>{{ product[3] }}</td>
        <td>
            <a href="/edit_product/{{ product[0] }}">Edit</a>
            |
            <a href="/delete_product/{{ product[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
