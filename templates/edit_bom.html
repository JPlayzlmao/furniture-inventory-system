{% extends "base.html" %}   
{% block content %}
<h1>Edit Bill of Materials</h1>
<form action="{{ url_for('update_bom', id=bom[0]) }}" method="POST">
    <label>Product</label>
    <select name="product_id">
        {% for product in products %}
        <option
            value="{{ product[0] }}"
            {% if product[0] == bom[1] %}
                selected
            {% endif %}
        >{{ product[1] }}</option>
        {% endfor %}
    </select><br><br>
    <label>Material</label>
    <select name="material_id">
        {% for material in materials %}
        <option
            value="{{ material[0] }}"
            {% if material[0] == bom[2] %}
                selected
            {% endif %}
        >{{ material[1] }}</option>
        {% endfor %}
    </select><br><br>
    <label>Amount Needed</label>
    <input type="number" step="0.01" value="{{ bom[3] }}" name="amount_needed" required><br><br>
    <button type="submit">Update B.O.M</button>
    <a href="{{ url_for('bill_of_materials') }}">Cancel</a>
</form>
{% endblock %}
