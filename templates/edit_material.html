{% extends "base.html" %}
{% block content %}
<h1>Edit Material</h1>
<form action="{{ url_for('update_material', id=material[0]) }}" method="POST">
    <label>Name</label>
    <input
        type="text"
        name="name"
        value="{{ material[1] }}"
        required
    ><br><br>
    <label>Unit</label>
    <input
        type="text"
        name="unit"
        value="{{ material[2] }}"
        required
    ><br><br>
    <label>Quantity</label>
    <input
        type="number"
        step="0.01"
        name="quantity"
        value="{{ material[3] }}"
        required
    ><br><br>
    <label>Price</label>
    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ material[4] }}"
        required
    ><br><br>
    <button type="submit">Save Changes</button>
    <a href="{{ url_for('materials') }}">Cancel</a>
</form>
{% endblock %}
