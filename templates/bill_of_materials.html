{% extends "base.html" %}
{% block content %}
<h1>Bill of Materials</h1>
<form action="{{ url_for('add_bom') }}" method="POST">
    <label>Select Product</label>
    <select name="product_id" required>
        {% for product in products%}
        <option value="{{ product[0] }}">{{ product[1] }}</option>
        {% endfor %}
    </select><br><br>
    <label>Select Material</label>
    <select name="material_id" required>
        {% for material in materials %}
        <option value="{{ material[0] }}">{{ material[1] }}</option>
        {% endfor %}
    </select><br><br>
    <label>Amount of Material</label>
    <input name="amount_needed" type="number" step="0.01" required><br><br>
    <button type="submit">Add to B.O.M</button>
</form>
<h2>Current Bill of Materials</h2>
<table border="1">
    <tr>
        <th>Product</th>
        <th>Material</th>
        <th>Amount</th>
        <th>Actions</th>
    </tr>
    {% for item in bom %}
    <tr>
        <td>{{ item[1] }}</td>
        <td>{{ item[2] }}</td>
        <td>{{ item[3] }}</td>
        <td>
            <a href="{{ url_for('edit_bom', id=item[0]) }}">Edit</a>
            |
            <a href="{{ url_for('delete_bom', id=item[0]) }}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
